<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C1B" />
      <stop offset="100%" stop-color="#0E1A38" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#1E335C" stroke-width="3" />

  <!-- Outer Hexagon / Honeycomb Glow -->
  <polygon points="96,24 152,56 152,120 96,152 40,120 40,56" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.4" />

  <!-- Inner Circle with Glow -->
  <circle cx="96" cy="88" r="46" fill="#070E22" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Gold Crown / Bee Icon -->
  <g transform="translate(96, 88) scale(1.15)">
    <!-- Crown Base -->
    <path d="M-22,12 L22,12 L18,-14 L7,0 L0,-20 L-7,0 L-18,-14 Z" fill="url(#goldGrad)" stroke="#78350F" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Crown Jewels -->
    <circle cx="-18" cy="-14" r="2.8" fill="#FFFFFF" />
    <circle cx="0" cy="-20" r="3.2" fill="#FFFFFF" />
    <circle cx="18" cy="-14" r="2.8" fill="#FFFFFF" />
    <circle cx="0" cy="4" r="2.5" fill="#78350F" />
    <circle cx="-10" cy="4" r="2" fill="#78350F" />
    <circle cx="10" cy="4" r="2" fill="#78350F" />
  </g>

  <!-- Brand Typography -->
  <text x="96" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="2" fill="url(#accentGrad)">
    BEE STORE
  </text>
</svg>
