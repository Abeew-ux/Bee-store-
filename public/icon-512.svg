<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A18" />
      <stop offset="100%" stop-color="#0F1D3D" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#1E335C" stroke-width="8" />

  <!-- Honeycomb Hexagon Background Detail -->
  <polygon points="256,64 416,156 416,340 256,432 96,340 96,156" fill="#0A1329" stroke="url(#goldGrad512)" stroke-width="6" opacity="0.6" />

  <!-- Inner Circle with Amber Glow -->
  <circle cx="256" cy="236" r="128" fill="#070E22" stroke="url(#goldGrad512)" stroke-width="8" filter="url(#glow512)" />

  <!-- Royal Bee / Crown Emblem -->
  <g transform="translate(256, 236) scale(3.2)">
    <path d="M-22,12 L22,12 L18,-14 L7,0 L0,-20 L-7,0 L-18,-14 Z" fill="url(#goldGrad512)" stroke="#78350F" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Jewels -->
    <circle cx="-18" cy="-14" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="-20" r="3.5" fill="#FFFFFF" />
    <circle cx="18" cy="-14" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="4" r="2.8" fill="#78350F" />
    <circle cx="-10" cy="4" r="2.2" fill="#78350F" />
    <circle cx="10" cy="4" r="2.2" fill="#78350F" />
  </g>

  <!-- Typography -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="6" fill="url(#goldGrad512)">
    BEE STORE
  </text>
</svg>
